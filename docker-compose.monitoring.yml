services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./prometheus/business-metrics:/textfile:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    # host.docker.internal is used by the blackbox jobs to reach host ports;
    # on Linux it is not provided by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana - Visualization Dashboard
    deploy:
      resources:
        limits:
          memory: 1g
  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3002}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-provisioning:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Alertmanager - Alert Management
    deploy:
      resources:
        limits:
          memory: 512m
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Secrets are read from files, not interpolated from ${VAR}: Alertmanager
      # performs no environment substitution in its config. Generated by
      # scripts/setup-notification-channels.sh; never commit these.
      - ./prometheus/alertmanager-secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped
    networks:
      - monitoring

  # Node Exporter - System Metrics
    deploy:
      resources:
        limits:
          memory: 256m
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./prometheus/business-metrics:/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|textfile)($$|/)'
      # Required for the .prom files written by business-metrics-exporter.sh to
      # be scraped; without it the business-metrics job returns host metrics only.
      - '--collector.textfile.directory=/textfile'
    restart: unless-stopped
    networks:
      - monitoring

  # cAdvisor - Container Metrics
  # cAdvisor needs host access to report container stats, but `privileged: true`
  # grants effectively root-equivalent access to the host. The specific
  # capabilities below plus the read-only host mounts are what it actually
  # requires. Its port is also bound to loopback rather than every interface.
    deploy:
      resources:
        limits:
          memory: 256m
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring

  # Redis Exporter - Redis Metrics
    deploy:
      resources:
        limits:
          memory: 512m
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    container_name: redis-exporter
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - redis

  # PostgreSQL Exporter - PostgreSQL Metrics
    deploy:
      resources:
        limits:
          memory: 128m
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - postgres

  # Redis (for testing/metrics)
  # Data services are deliberately NOT published to the host. They exist to feed
  # the exporters; only the exporters themselves are exposed, on loopback.
    deploy:
      resources:
        limits:
          memory: 128m
  redis:
    image: redis:8.10.2
    container_name: redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - monitoring

  # PostgreSQL (for testing/metrics)
    deploy:
      resources:
        limits:
          memory: 512m
  postgres:
    image: postgres:16.15
    container_name: postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoring

  # Blackbox Exporter - External endpoint monitoring
    deploy:
      resources:
        limits:
          memory: 1g
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./prometheus/blackbox-exporter.yml:/config/blackbox-exporter.yml
    command:
      - '--config.file=/config/blackbox-exporter.yml'
    restart: unless-stopped
    networks:
      - monitoring

  # Web Dashboard - Custom Interface
    deploy:
      resources:
        limits:
          memory: 128m
  web-dashboard:
    image: nginx:1.30.5-alpine
    container_name: web-dashboard
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./web-dashboard:/usr/share/nginx/html:ro
      - ./web-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - monitoring

    deploy:
      resources:
        limits:
          memory: 64m
networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  postgres-data:
