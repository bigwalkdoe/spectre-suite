services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro,z
      - ./prometheus/business-metrics:/textfile:ro,z
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    # host.docker.internal is used by the blackbox jobs to reach host ports;
    # on Linux it is not provided by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3002}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:z
      - ./grafana-provisioning:/etc/grafana/provisioning/datasources:z
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 1g

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    # The image defaults to uid 65534 (nobody). The secrets directory is mode
    # 0700 owned by the host user, so nobody cannot even traverse it: every
    # notification failed with "could not read
    # /etc/alertmanager/secrets/smtp_password: permission denied". This only
    # surfaces at notification time, not at config-load time, so it looks like a
    # healthy Alertmanager. Running as root is the same trade-off already made
    # for node-exporter below, and keeps the secret files at 0600 rather than
    # making them world-readable to satisfy nobody. A tighter fix is matching
    # this to the host UID/GID, or switching to top-level Compose secrets under
    # /run/secrets; both need a way to set the owner without sudo.
    user: root
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      # Secrets are read from files, not interpolated from ${VAR}: Alertmanager
      # performs no environment substitution in its config. Generated by
      # scripts/setup-notification-channels.sh; never commit these.
      - ./prometheus/alertmanager-secrets:/etc/alertmanager/secrets:ro,z
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    # The image defaults to uid 65534 (nobody), and /host/proc is the *host's*
    # procfs: procfs denies access to a PID that is not in the mount's own PID
    # namespace, so /host/proc/1/mountinfo was unreadable and the filesystem
    # collector failed with "permission denied" on every scrape. That published
    # no node_filesystem_* series at all, and HighDiskUsage and CriticalDiskUsage
    # both divide node_filesystem_avail_bytes{mountpoint="/"} by
    # node_filesystem_size_bytes -- with no series they could never fire, so a
    # disk alert that silently never triggers reads as coverage.
    #
    # `pid: host` is what actually fixes it: the container then shares the host
    # PID namespace, so the bind-mounted /proc and the mount's namespace agree
    # and PID 1 is readable. Running as root is still required, because the
    # host's PID 1 mountinfo is root-owned. This is the standard node-exporter
    # host-monitoring configuration; it stays loopback-bound with read-only
    # mounts, and it is the only service granted either privilege.
    user: root
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./prometheus/business-metrics:/textfile:ro,z
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|textfile)($$|/)'
      # Required for the .prom files written by business-metrics-exporter.sh to
      # be scraped; without it the business-metrics job returns host metrics only.
      - '--collector.textfile.directory=/textfile'
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256m

  # cAdvisor - Container Metrics
  # cAdvisor needs host access to report container stats, but `privileged: true`
  # grants effectively root-equivalent access to the host. The specific
  # capabilities below plus the read-only host mounts are what it actually
  # requires. Its port is also bound to loopback rather than every interface.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    ports:
      - "127.0.0.1:8080:8080"
    # Without --docker_only, cAdvisor also walks the host's systemd cgroup tree.
    # That produced 134 spurious series for slices such as
    # /system.slice/auditd.service, which carry no `container` label, so the
    # container memory rule divided by an absent limit and alerted
    # "Container  is using +Inf of its memory limit" -- all critical-looking and
    # none actionable. Host metrics come from node-exporter; this is for
    # containers only.
    command:
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256m

  # Redis Exporter - Redis Metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    container_name: redis-exporter
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 512m

  # PostgreSQL Exporter - PostgreSQL Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 128m

  # Redis (for testing/metrics)
  # Data services are deliberately NOT published to the host. They exist to feed
  # the exporters; only the exporters themselves are exposed, on loopback.
  redis:
    image: redis:8.10.2
    container_name: redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    expose:
      - "6379"
    # Without this, every recreate or image update started Redis from an empty
    # dataset, so anything cached was silently lost and the nightly RDB backup
    # captured a cache that no longer backed anything. Redis writes its dataset to
    # /data; mount a named volume there.
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128m

  # PostgreSQL (for testing/metrics)
  postgres:
    image: postgres:16.15
    container_name: postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m

  # Blackbox Exporter - External endpoint monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./prometheus/blackbox-exporter.yml:/config/blackbox-exporter.yml:z
    command:
      - '--config.file=/config/blackbox-exporter.yml'
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 1g

  # Web Dashboard - Custom Interface
  web-dashboard:
    image: nginx:1.30.5-alpine
    container_name: web-dashboard
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./web-dashboard:/usr/share/nginx/html:ro,z
      - ./web-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  postgres-data:
  redis-data:
