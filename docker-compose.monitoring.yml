services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: prometheus
    ports:
      - "127.0.0.1:20161:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro,z
      - ./prometheus/business-metrics:/textfile:ro,z
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.route-prefix=/prometheus/'
      - '--web.external-url=/prometheus/'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:172.21.0.1"
    restart: unless-stopped
    networks:
      - monitoring
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    ports:
      - "127.0.0.1:20163:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:20160/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:z
      - ./grafana-provisioning:/etc/grafana/provisioning:z
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    user: root
    ports:
      - "127.0.0.1:20162:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - ./prometheus/templates:/etc/alertmanager/templates:ro,z
      - ./prometheus/alertmanager-secrets:/etc/alertmanager/secrets:ro,z
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.route-prefix=/alertmanager/'
      - '--web.external-url=http://localhost:20162/alertmanager/'
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "127.0.0.1:20164:9100"
    user: root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./prometheus/business-metrics:/textfile:ro,z
    command:
      - '--path.procfs=/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|textfile)($$|/)'
      - '--collector.textfile.directory=/textfile'
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    ports:
      - "127.0.0.1:20165:8080"
    command:
      - --docker_only=true
      - --docker=unix:///var/run/docker.sock
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
      - label=disable
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Redis Exporter - Redis Metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    container_name: redis-exporter
    ports:
      - "127.0.0.1:20166:9121"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # PostgreSQL Exporter - PostgreSQL Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    ports:
      - "127.0.0.1:20167:9187"
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Redis (for testing/metrics)
  redis:
    image: redis:8.10.2
    container_name: redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # PostgreSQL (for testing/metrics)
  postgres:
    image: postgres:16.15
    container_name: postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Blackbox Exporter - External endpoint monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    ports:
      - "127.0.0.1:20168:9115"
    volumes:
      - ./prometheus/blackbox-exporter.yml:/config/blackbox-exporter.yml:z
    command:
      - '--config.file=/config/blackbox-exporter.yml'
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Web Dashboard - Custom Interface
  web-dashboard:
    image: nginx:1.30.5-alpine
    container_name: web-dashboard
    ports:
      - "127.0.0.1:20160:80"
    volumes:
      - ./web-dashboard:/usr/share/nginx/html:ro,z
      - ./web-dashboard/00-http-hardening.conf:/etc/nginx/conf.d/00-http-hardening.conf:ro,z
      - ./web-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - dashboard-actions
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Dashboard Actions - allowlisted trigger queue
  dashboard-actions:
    build:
      context: ./web-dashboard/actions-backend
    container_name: dashboard-actions
    environment:
      - DASHBOARD_ACTION_TOKEN=${DASHBOARD_ACTION_TOKEN:?set DASHBOARD_ACTION_TOKEN}
      - PORT=8090
      - TRIGGERS_DIR=/triggers
      - REPO_ROOT=/repo
    volumes:
      - ./dashboard-actions/triggers:/triggers:z
      - ./:/repo:ro,z
    expose:
      - "8090"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"
        loki-batch-wait: "1s"
        loki-external-labels: "job=docker,container_name={{.Name}}"

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:3.7.10
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro,z
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m

  # Promtail - Log Shipper (test file only - journal reading doesn't work in container)
  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    user: root
    volumes:
      - /home/deon/promtail-test:/host-tmp:ro,z
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro,z
    command: -config.file=/etc/promtail/promtail-config.yaml
    restart: unless-stopped
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  postgres-data:
  redis-data:
  loki-data:
