[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "1.0.2"
description = "Spectre - Autonomous AI Engineering Operating System for Fedora Linux (unified suite + agent)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Spectre Contributors"},
]
keywords = ["linux", "automation", "ai", "engineering", "operations", "fedora", "security", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12.0,<0.26",
    "rich>=14.2.0",
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.19",
    "psutil>=5.9.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.0",
    "watchdog>=4.0.0",
    "gitpython>=3.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "textual>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
    "types-PyYAML>=6.0.0",
    "types-psutil>=5.9.0",
]

[project.scripts]
spectre = "spectre.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Agent tests live under tests/agent/; suite shell tests remain tests/*.sh run via run_tests.sh
testpaths = ["tests/agent"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["spectre"]
