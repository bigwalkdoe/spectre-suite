<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Spectre Suite banner</title>
  <desc id="desc">Dark terminal-inspired banner for Spectre Suite: Linux system maintenance, backup, and monitoring automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200M80 0V320M160 0V320M240 0V320M320 0V320M400 0V320M480 0V320M560 0V320M640 0V320M720 0V320M800 0V320M880 0V320M960 0V320M1040 0V320M1120 0V320"/>
  </g>
  <rect x="48" y="44" width="1104" height="232" rx="18" fill="#020617" fill-opacity="0.55" stroke="#334155"/>
  <circle cx="86" cy="72" r="7" fill="#fb7185"/>
  <circle cx="110" cy="72" r="7" fill="#fbbf24"/>
  <circle cx="134" cy="72" r="7" fill="#34d399"/>
  <text x="86" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="54" font-weight="700" fill="url(#accent)" filter="url(#glow)">SPECTRE SUITE</text>
  <text x="88" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#cbd5e1">Linux maintenance · backups · restic · Prometheus/Grafana · security automation</text>
  <text x="88" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#94a3b8">$ spectre actions verify   ▸ registry ↔ disk ↔ scheduler   ▸ truthful by default</text>
  <g transform="translate(930,96)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#a5b4fc">
    <text x="0" y="0">┌─ dispatch ─────┐</text>
    <text x="0" y="24">│ spectre run    │</text>
    <text x="0" y="48">│ actions verify │</text>
    <text x="0" y="72">│ provenance     │</text>
    <text x="0" y="96">└────────────────┘</text>
  </g>
  <g transform="translate(930,212)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#67e8f9">
    <text x="0" y="0">[✓] backups  [✓] metrics  [✓] alerts</text>
  </g>
</svg>
