# Example ONLY: terminate TLS and authenticate before proxying to Spectre dashboard.
# Adapt hostnames, cert paths, auth, and upstreams to your environment.
# The dashboard container itself listens on 127.0.0.1:8081 (HTTP).

limit_req_zone $binary_remote_addr zone=edge_dashboard:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name dashboard.example.invalid;

    ssl_certificate /etc/ssl/certs/dashboard.example.invalid.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/dashboard.example.invalid.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Replace with your SSO/auth module (OIDC, OAuth2 Proxy, basic auth, mTLS, etc.).
    # auth_request /oauth2/auth;
    # error_page 401 = /oauth2/sign_in;

    client_max_body_size 1m;

    location / {
        limit_req zone=edge_dashboard burst=40 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location /actions/ {
        limit_req zone=edge_dashboard burst=10 nodelay;
        # Require stronger authz/audit for action triggers.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name dashboard.example.invalid;
    return 301 https://$host$request_uri;
}
