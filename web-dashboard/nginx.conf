server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    limit_conn dashboard_conn 40;

    # Compress static assets and proxied JSON responses. The vendored Chart.js
    # bundle is ~196KB, and Prometheus API responses are JSON, so this trims
    # meaningful transfer size on first load and each refresh.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Baseline security headers. Nginx add_header inheritance means any location
    # block that defines add_header must repeat these (see static/vendored
    # locations below). CSP is report-only while inline handlers remain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self';" always;

    # Docker internal DNS; used to defer resolution so nginx -t works in
    # CI/test environments where optional backend services are absent.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Do not serve dotfiles or dashboard internals from the bind-mounted document root.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* ^/(?:nginx\.conf|README\.md|actions-backend)(?:/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # The dashboard queries Prometheus from the browser. It used to point
    # straight at :9090, which is a different origin from the page itself, and
    # Prometheus sends no Access-Control-Allow-Origin, so every fetch was blocked
    # and the dashboard rendered empty.
    #
    # Proxying /api/ keeps those requests same-origin instead of enabling CORS
    # on Prometheus, which would let any page read the metrics.
    # Prometheus serves under --web.route-prefix=/prometheus/ (compose), so map
    # /api/* (dashboard API contract) -> /prometheus/api/* on the backend.
    set $prometheus_upstream http://prometheus:9090;
    location /api/ {
        limit_req zone=dashboard_api burst=60 nodelay;
        limit_except GET HEAD { deny all; }
        rewrite ^/api/(.*)$ /prometheus/api/$1 break;
        proxy_pass $prometheus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Dashboard action triggers (allowlisted, token-protected). Proxied to the
    # dashboard-actions service which queues trigger files for a host handler.
    # No backend is required for read-only dashboard features.
    set $dashboard_actions_upstream http://dashboard-actions:8090;
    location /actions/ {
        limit_req zone=dashboard_actions burst=10 nodelay;
        limit_conn dashboard_conn 10;
        limit_except POST { deny all; }
        rewrite ^/actions/(.*)$ /$1 break;
        proxy_pass $dashboard_actions_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Dashboard-Action-Token $http_x_dashboard_action_token;
        proxy_read_timeout 30s;
    }

    # Backend UIs proxied same-origin so dashboard links work without exposing
    # separate ports to the browser. Backends are configured with matching
    # route-prefix/subpath settings in docker-compose.monitoring.yml.
    set $prometheus_ui_upstream http://prometheus:9090;
    location /prometheus/ {
        proxy_pass $prometheus_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /prometheus;
        proxy_read_timeout 60s;
    }

    set $grafana_upstream http://grafana:3000;
    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    set $alertmanager_upstream http://alertmanager:9093;
    location /alertmanager/ {
        proxy_pass $alertmanager_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /alertmanager;
        proxy_read_timeout 60s;
    }

    # Dashboard source/assets change frequently; avoid stale clients showing "no
    # data" due to cached logic/assets after deploys.
    location ~* \.(?:html|js|css|svg|png|ico|webp|json|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self';" always;
        try_files $uri =404;
    }

    # Vendored third-party assets are versioned by content (and integrity in
    # index.html), so they can be cached aggressively across deploys.
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self';" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
