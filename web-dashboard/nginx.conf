server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard queries Prometheus from the browser. It used to point
    # straight at :9090, which is a different origin from the page itself, and
    # Prometheus sends no Access-Control-Allow-Origin, so every fetch was blocked
    # and the dashboard rendered empty.
    #
    # Proxying /api/ keeps those requests same-origin instead of enabling CORS
    # on Prometheus, which would let any page read the metrics.
    location /api/ {
        proxy_pass http://prometheus:9090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
