server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS; used to defer resolution so nginx -t works in
    # CI/test environments where optional backend services are absent.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The dashboard queries Prometheus from the browser. It used to point
    # straight at :9090, which is a different origin from the page itself, and
    # Prometheus sends no Access-Control-Allow-Origin, so every fetch was blocked
    # and the dashboard rendered empty.
    #
    # Proxying /api/ keeps those requests same-origin instead of enabling CORS
    # on Prometheus, which would let any page read the metrics.
    # Prometheus serves under --web.route-prefix=/prometheus/ (compose), so map
    # /api/* (dashboard API contract) -> /prometheus/api/* on the backend.
    set $prometheus_upstream http://prometheus:9090;
    location /api/ {
        rewrite ^/api/(.*)$ /prometheus/api/$1 break;
        proxy_pass $prometheus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Dashboard action triggers (allowlisted, token-protected). Proxied to the
    # dashboard-actions service which queues trigger files for a host handler.
    # No backend is required for read-only dashboard features.
    set $dashboard_actions_upstream http://dashboard-actions:8090;
    location /actions/ {
        rewrite ^/actions/(.*)$ /$1 break;
        proxy_pass $dashboard_actions_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Dashboard-Action-Token $http_x_dashboard_action_token;
        proxy_read_timeout 30s;
    }

    # Backend UIs proxied same-origin so dashboard links work without exposing
    # separate ports to the browser. Backends are configured with matching
    # route-prefix/subpath settings in docker-compose.monitoring.yml.
    set $prometheus_ui_upstream http://prometheus:9090;
    location /prometheus/ {
        proxy_pass $prometheus_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /prometheus;
        proxy_read_timeout 60s;
    }

    set $grafana_upstream http://grafana:3000;
    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    set $alertmanager_upstream http://alertmanager:9093;
    location /alertmanager/ {
        proxy_pass $alertmanager_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /alertmanager;
        proxy_read_timeout 60s;
    }

    # Dashboard HTML/JS changes frequently; avoid stale clients showing "no data"
    # due to cached logic/assets after deploys.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
