# Included in nginx http{} via conf.d. Keep directives http-level only.
# Conservative limits for dashboard/API/action endpoints (per client IP).
limit_req_zone $binary_remote_addr zone=dashboard_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dashboard_actions:10m rate=5r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=dashboard_conn:10m;
