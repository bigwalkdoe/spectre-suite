name: Full Test Suite
on: [push]
jobs:
  test-suite:
    name: Full Test Suite
    strategy:
      matrix:
        python-version: ['3.11']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          pip cache purge
          pip install numpy==1.26.0 pandas==2.0.3 scikit-learn scipy requests
      - name: Verify Python dependencies
        run: python -c "import numpy as np; import pandas; print('Numpy:', np.__version__, '| Pandas:', pandas.__version__)"
      - name: Run tests
        run: ./tests/run_tests.sh