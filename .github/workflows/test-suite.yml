name: Full Test Suite
on: [push]
jobs:
  test-suite:
    name: Full Test Suite
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # pip cache purge below discarded the cache this enabled.
          cache: pip
      # These were pinned to exact versions (numpy==1.26.0, pandas==2.0.3).
      # pandas 2.0.3 predates Python 3.12 wheels, so the install falls back to a
      # source build and fails on any interpreter newer than 3.11. The unpinned
      # floor in scripts/ml-anomaly/requirements.txt is what the code actually
      # needs, and the full suite passes against current releases.
      - name: Install Python dependencies
        run: |
          pip install -r scripts/ml-anomaly/requirements.txt || \
            pip install "numpy>=1.21.0" "pandas>=1.3.0" "scikit-learn>=1.0.0" "scipy>=1.7.0" requests prometheus-client pytest
      - name: Verify Python dependencies
        run: python -c "import numpy as np; import pandas; import sklearn; print('Numpy:', np.__version__, '| Pandas:', pandas.__version__, '| sklearn:', sklearn.__version__)"
      - name: Run tests
        run: ./tests/run_tests.sh