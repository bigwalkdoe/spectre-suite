name: Automated Security Scanning

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday
  push:
    branches: [ main, develop ]
  # The OPA compliance gate needs to run before merge; with only a main/develop
  # push trigger and a weekly schedule, a policy that fails open could reach
  # main unnoticed.
  pull_request:
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # Pinned to a released tag. This job holds security-events: write, so a
        # mutable ref (it was @master) means whoever moves that branch runs
        # arbitrary code with SARIF upload rights.
        # Pinned to an immutable commit SHA of v0.36.0. This job holds
        # security-events: write, so a mutable ref (it was @master) let whoever
        # moved that branch run code with SARIF upload rights.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate summary
        run: |
          echo "# Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "## Trivy Filesystem Scan" >> $GITHUB_STEP_SUMMARY
          echo "- Scan completed at $(date)" >> $GITHUB_STEP_SUMMARY

  opa-policy-check:
    name: OPA Policy Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: v0.68.0

      - name: Check Rego syntax
        run: |
          for file in $(find . -name "*.rego" 2>/dev/null || true); do
            opa check "$file"
          done

            # The previous version asserted every control as `true` and evaluated the
      # policies against those constants. Worse, each policy file declared its
      # own hardcoded `= true` constant, so `data.security` reported full
      # compliance for any input at all -- the check could not fail. The policies
      # now derive every control from input, and CI evaluates them against a
      # committed, reviewable baseline (scripts/security/opa/baseline.json).
      # Flipping any control there fails the job until the config is fixed.
      - name: Evaluate policies against declared baseline
        run: |
          set -euo pipefail
          denials=$(opa eval --format raw \
            --data scripts/security/opa/policies \
            --input scripts/security/opa/baseline.json \
            '[m | data.security[k].deny[m]]' | tail -1)
          echo "Policy denials: $denials"
          if [ "$denials" != "[]" ]; then
            echo "::error::OPA policy violations detected:"
            echo "$denials"
            exit 1
          fi
          echo "All OPA controls satisfied."

      - name: Upload policy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opa-policy-results
          path: scripts/security/opa/baseline.json

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          wget -q https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz
          tar -xzf k6-v0.49.0-linux-amd64.tar.gz
          sudo mv k6-v0.49.0-linux-amd64/k6 /usr/local/bin/

      # The previous version installed k6 and then only echoed what it would do.
      # It now requires an explicit target and fails loudly if none is set, so
      # this job cannot silently report success without running.
      - name: Run performance regression test
        env:
          SPECTRE_LOAD_TEST_URL: ${{ vars.SPECTRE_LOAD_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SPECTRE_LOAD_TEST_URL}" ]; then
            echo "SPECTRE_LOAD_TEST_URL repository variable is not set; refusing to report a pass." >&2
            exit 1
          fi
          k6 run scripts/performance/load-testing/k6-script.js \
            -e BASE_URL="$SPECTRE_LOAD_TEST_URL" \
            -e VUS="${VUS:-10}" -e DURATION="${DURATION:-30s}"

