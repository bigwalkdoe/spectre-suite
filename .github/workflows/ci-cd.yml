name: System Maintenance Suite CI/CD
on: [push]
jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # Previously `needs: syntax-check`, a job that does not exist in this
    # workflow, so this job could never start and its problems went unnoticed.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        # Pinned to a released tag; @master gave a mutable ref SARIF upload
        # rights (security-events: write).
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          # Was '. ' with a trailing space, which scanned a non-existent path.
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'