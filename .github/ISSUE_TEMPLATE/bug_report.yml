name: Bug report
description: Report a problem with Spectre Suite
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce and diagnose the issue.
        Do **not** include secrets, credentials, private keys, or sensitive host data.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: Clear description of the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide commands, configuration context, and minimal steps.
      placeholder: |
        1. Run `spectre ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/distribution, Python version, Spectre Suite version/commit, and relevant runtime details.
      placeholder: |
        - OS:
        - Python:
        - spectre version/commit:
        - Install method (source/systemd/docker/etc.):
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste redacted logs, command output, or error messages.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for similar reports.
        - label: I have removed secrets and sensitive information from this report.
