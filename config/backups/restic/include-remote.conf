# spectre-suite restic offsite scope (small, irreplaceable; Drive quota aware)
# Local include.conf covers everything else. backup.sh also adds /backups/databases
# and the pre-backup dump dir (host pg_dumpall + container configs) offsite.

# Credentials and identity
~/.ssh
~/.gnupg

# Shell and git configuration
~/.bashrc
~/.bash_profile
~/.zshrc
~/.gitconfig
~/.gitignore_global

# Editor/desktop and host tooling configuration
~/.config/systemd
~/.config/nvim
~/.config/kde-macos
~/.config/Code/User
~/.config/spectre-suite
~/.config/spectre

# Documents (absorbed from home-backup; irreplaceable)
~/docs

# Deliberately NOT included: ~/.config/spectre-backup (contains old repo key),
# broad ~/.secrets, ~/dev, Docker volumes/config tarballs, projects, working trees.
