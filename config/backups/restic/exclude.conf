# Suite-specific: never snapshot repository keys, old install secrets, or backup output.
#
# Patterns are anchored to the home directory so they work no matter who runs
# the backup. restic does not expand ~ in --exclude-file, so a literal ~/...
# pattern is treated as a relative path and silently matches nothing (verified
# against restic 0.17.3: "~/x" is ignored while "**/x" excludes it). Absolute
# paths here are also unsafe: they pin this file to one user's machine and leak
# the home directory name into a public repository.
#
# Match by basename+parent, not by home path:
#   **/.config/spectre-backup            -> old install dir + its password file
#   **/.secrets/spectre-restic-password  -> repo password (old and new locations)
#   **/.secrets/restic-repo-password     -> legacy repo password
#   **/.secrets/spectre-suite-backups.env -> backups env file
#   **/Archive/backups                   -> home-backup output
#   **/archives                          -> historical archives
**/.config/spectre-backup
**/.secrets/spectre-restic-password
**/.secrets/restic-repo-password
**/.secrets/spectre-suite-backups.env
**/Archive/backups
**/archives
