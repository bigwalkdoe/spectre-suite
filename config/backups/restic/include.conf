# spectre-suite restic local scope (home/workstation)
# Real paths only. Symlinks ~/code, ~/documents, ~/archives are not listed so
# each byte is stored once under its real path. Missing paths are warned/skipped.

# Shell / dotfiles
~/.bashrc
~/.bash_profile
~/.zshrc
~/.gitconfig
~/.gitignore_global
~/.ssh
~/.gnupg

# Config and local state (large derived caches excluded by exclude.conf)
~/.config
~/.local/share

# Git mirrors (history without worktrees) - refreshed by git-mirror.sh
~/.git-mirror

# Absorbed home-backup scope (retire home-backup only after verified snapshot)
# ~/dev is 25G on disk, ~7.4G after excludes; local-only. Working trees included
# (complete replacement for home-backup); .git history also covered by mirror.
~/dev
~/Documents
~/.secrets

# Small, irreplaceable archive content (real paths; ~/archives symlink excluded)
~/archive/old-projects
~/archive/installers
~/archive/README.md
