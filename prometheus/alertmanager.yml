global:
  resolve_timeout: 5m
  # Slack is the only notification channel, so SMTP and PagerDuty are gone from
  # this file entirely. Leaving them in place meant every alert logged a
  # "Notify for alerts failed" for an integration nobody had configured, which
  # buries the failures that matter.
  #
  # Alertmanager performs no ${VAR} substitution, so the webhook is read from a
  # file written by `spectre run setup-notification-channels` rather than
  # interpolated here. The *_file variants are only valid per-receiver, not
  # under `global`, so each slack_config names the file explicitly.
  slack_api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'

# Slack formatting lives in templates mounted by docker-compose.monitoring.yml.
# `{{ .GeneratorURL }}` is valid only inside `{{ range .Alerts }}` in the text
# templates; do not use it in a single-value field like title_link.
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Notification routes
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Must be first. Alertmanager stops at the first matching sibling route, and
    # the Watchdog alert carries severity="info", so when this route sat below the
    # severity routes the info-receiver matched first and watchdog-receiver was
    # never used. Matched before severity so the dead-man's switch has its own
    # receiver rather than riding on the info path.
    - match:
        alertname: 'Watchdog'
      receiver: 'watchdog-receiver'
      repeat_interval: 24h
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-receiver'
      repeat_interval: 6h
    - match:
        severity: info
      receiver: 'info-receiver'
      repeat_interval: 24h

# Notification receivers
# Alertmanager performs NO environment-variable substitution in its config file,
# so the webhook URL is read from a file rather than interpolated here. It is
# written by `spectre run setup-notification-channels` -- see
# prometheus/alertmanager-secrets/README.md.
receivers:
  # Slack is the only channel. Severity is carried by the attachment colour and
  # the title prefix. No `title_link:`: `{{ .GeneratorURL }}` is valid only inside
  # `{{ range .Alerts }}` (see templates/*.tmpl). Slack commonly ignores
  # `channel`/`username`/`icon_emoji` on incoming webhooks.
  - name: 'default-receiver'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        color: '#d40d0d'
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  - name: 'critical-receiver'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        color: '#d40d0d'
        title: '{{ template "slack.critical.title" . }}'
        text: '{{ template "slack.critical.text" . }}'

  - name: 'warning-receiver'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        color: '#daa038'
        title: '{{ template "slack.warning.title" . }}'
        text: '{{ template "slack.warning.text" . }}'

  - name: 'info-receiver'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        color: '#2eb886'
        title: '{{ template "slack.info.title" . }}'
        text: '{{ template "slack.info.text" . }}'

  # The dead-man's switch. The text says what to do, because the only time anyone
  # reads it is when it fires, which means delivery has already failed and
  # everything else they would normally rely on is silent.
  - name: 'watchdog-receiver'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        send_resolved: true
        color: '#2eb886'
        title: '{{ template "slack.watchdog.title" . }}'
        text: '{{ template "slack.watchdog.text" . }}'

# Inhibition rules
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance', 'job']
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance', 'job']
  # The previous third rule inhibited alertnames InstanceDown and
  # InstanceHealthcheck. Neither is defined in alert_rules.yml -- the real
  # target-liveness alerts are UptimeCheckFailed, BlackboxExporterDown and the
  # *ExporterDown family -- so the rule could never inhibit anything. These
  # express the evident intent against alertnames that exist: do not report
  # latency or DNS trouble for an endpoint already known to be down.
  #
  # One rule per target alertname. target_match takes a single string per key,
  # not a list, so listing both alertnames here makes Alertmanager refuse to
  # start with "cannot unmarshal !!seq into string".
  - source_match:
      alertname: 'UptimeCheckFailed'
    target_match:
      alertname: 'HighEndpointLatency'
    equal: ['instance']
  - source_match:
      alertname: 'UptimeCheckFailed'
    target_match:
      alertname: 'DNSCheckFailed'
    equal: ['instance']
