global:
  resolve_timeout: 5m
  # Email notification configuration
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@example.com'
  # Credentials come from files written by scripts/setup-notification-channels.sh;
  # Alertmanager does not expand ${VAR} in this file. The *_file variants are
  # only valid per-receiver, not under `global`, so SMTP auth is set on each
  # email_config below and slack_api_url_file sits here.
  # PagerDuty configuration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  # Slack configuration
  slack_api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'

# Note: there is deliberately no `templates:` key. The previous value
# ('/etc/alertmanager/templates/*.tmpl') had no corresponding bind mount, so the
# glob never matched anything, and every receiver formats inline via html/text
# rather than from a template file. Add a mount here when adding templates.

# Notification routes
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Must be first. Alertmanager stops at the first matching sibling route, and
    # the Watchdog alert carries severity="info", so when this route sat below the
    # severity routes the info-receiver matched first and watchdog-receiver was
    # never used. Matched before severity so the dead-man's switch has its own
    # receiver rather than riding on the info path.
    - match:
        alertname: 'Watchdog'
      receiver: 'watchdog-receiver'
      repeat_interval: 24h
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-receiver'
      repeat_interval: 6h
    - match:
        severity: info
      receiver: 'info-receiver'
      repeat_interval: 24h

# Notification receivers
# Alertmanager performs NO environment-variable substitution in its config file,
# so the previous '${SMTP_PASSWORD}' style placeholders were passed through as
# literal strings. Secrets are supplied via file-based auth_config files
# generated from the environment before startup -- see
# scripts/setup-notification-channels.sh and docs/CONFIGURATION_EXAMPLES.md.
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'alertmanager@example.com'
        send_resolved: true
        auth_username: 'alertmanager'
        auth_password_file: '/etc/alertmanager/secrets/smtp_password'
        headers:
          Subject: '[ALERT] {{ .GroupLabels.alertname }}'
        html: '<h2>{{ .GroupLabels.alertname }}</h2><p>{{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>'

  - name: 'critical-receiver'
    email_configs:
      - to: 'alertmanager@example.com'
        send_resolved: true
        auth_username: 'alertmanager'
        auth_password_file: '/etc/alertmanager/secrets/smtp_password'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .GroupLabels.instance }}'
        html: '<h2 style="color:red;">CRITICAL: {{ .GroupLabels.alertname }}</h2><p><strong>Instance:</strong> {{ .GroupLabels.instance }}</p><p>{{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p><p><strong>Graph:</strong> <a href="{{ .ExternalURL }}">View in Prometheus</a></p>'
    pagerduty_configs:
      # routing_key only: service_key was removed in Alertmanager 0.25 and is a
      # validation error alongside it on current releases.
      - routing_key_file: '/etc/alertmanager/secrets/pagerduty_routing_key'
        client: 'System-Maintenance'
        client_url: 'http://localhost:9093'
        description: '{{ .GroupLabels.alertname }} - {{ .GroupLabels.instance }}'
        severity: 'critical'
        send_resolved: true
        images:
          - src: 'https://img.icons8.com/color/48/high-priority.png'
            alt: 'Critical Alert'
            href: '{{ .ExternalURL }}'

  - name: 'warning-receiver'
    email_configs:
      - to: 'alertmanager@example.com'
        send_resolved: true
        auth_username: 'alertmanager'
        auth_password_file: '/etc/alertmanager/secrets/smtp_password'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'
        html: '<h2 style="color:orange;">WARNING: {{ .GroupLabels.alertname }}</h2><p>{{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        channel: '#alerts-warning'
        username: 'Alertmanager'
        icon_emoji: ':warning:'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: "{{ range .Alerts }}*Severity:* `{{ .Labels.severity }}`\n*Instance:* {{ .Labels.instance }}\n*Description:* {{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

  - name: 'info-receiver'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        channel: '#alerts-info'
        username: 'Alertmanager'
        icon_emoji: ':information_source:'
        title: '[INFO] {{ .GroupLabels.alertname }}'
        text: "{{ range .Alerts }}*Description:* {{ .Annotations.description }}\n{{ end }}"

  - name: 'watchdog-receiver'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        channel: '#alerts-watchdog'
        username: 'Alertmanager'
        icon_emoji: ':dog:'
        title: 'Watchdog Alive'
        text: 'Alertmanager is running and sending notifications'

# Inhibition rules
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance', 'job']
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance', 'job']
  # The previous third rule inhibited alertnames InstanceDown and
  # InstanceHealthcheck. Neither is defined in alert_rules.yml -- the real
  # target-liveness alerts are UptimeCheckFailed, BlackboxExporterDown and the
  # *ExporterDown family -- so the rule could never inhibit anything. These
  # express the evident intent against alertnames that exist: do not report
  # latency or DNS trouble for an endpoint already known to be down.
  #
  # One rule per target alertname. target_match takes a single string per key,
  # not a list, so listing both alertnames here makes Alertmanager refuse to
  # start with "cannot unmarshal !!seq into string".
  - source_match:
      alertname: 'UptimeCheckFailed'
    target_match:
      alertname: 'HighEndpointLatency'
    equal: ['instance']
  - source_match:
      alertname: 'UptimeCheckFailed'
    target_match:
      alertname: 'DNSCheckFailed'
    equal: ['instance']
